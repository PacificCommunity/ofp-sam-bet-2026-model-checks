name: ofp-sam-bet-2026-model-checks
description: Build portable report-ready BET 2026 Jitter and Retrospective outputs from selected model jobs.
command: bash run.sh
docker_image: ghcr.io/pacificcommunity/tuna-flow@sha256:7b9dc95f535025a42109ac958c4faa3af96592cd19510ac0be15af4478eccf27

resources:
  cpus: 2
  memory: 6GB
  disk: 12GB

env:
  MODEL_JOBS: "8146,8096"
  MODEL_CHECKS: jitter
  MODEL_CHECK_TITLE: BET 2026 jitter model checks
  MODEL_CHECK_OUTPUT_DIR: jitter
  JITTER_REL_DIFF_THRESHOLD: "10"
  JITTER_REPORT_DPI: "300"
  MODEL_CHECK_REPORT_DPI: "300"
  FLR4MFCL_GITHUB_REF: 3faaf84a4867175bfea50d89e4d518c085e84739
  MFCLKIT_GITHUB_REF: 9b949db539619be52a63b321bd138c937f868199
  MFCLSHINY_GITHUB_REF: 986d23682dfcb1294bfd8509c0a0b59ae2a5a7a4
  KFLOW_RUNTIME_PACKAGES: none
  KFLOW_REPO_RUNTIME_PACKAGES: FLR4MFCL=PacificCommunity/ofp-sam-flr4mfcl@3faaf84a4867175bfea50d89e4d518c085e84739,mfclkit=PacificCommunity/ofp-sam-mfclkit@9b949db539619be52a63b321bd138c937f868199,mfclshiny=PacificCommunity/mfclshiny@986d23682dfcb1294bfd8509c0a0b59ae2a5a7a4
  KFLOW_REPO_RUNTIME_UPDATE: always
  KFLOW_RUNTIME_REQUIRE_PRIVATE_PACKAGES: "true"
  KFLOW_RUNTIME_UPDATE: always
  TUNA_FLOW_RUNTIME_UPDATE: always
  KFLOW_RUNTIME_UPDATE_INTERVAL_HOURS: "0"
  KFLOW_RUNTIME_GITHUB_AUTH: "true"
  KFLOW_FORWARD_GITHUB_TOKEN_TO_RUNTIME: "true"

output_patterns:
  - jitter/**
  - retrospective/**

triggers: {}

job_config:
  optional:
    - MODEL_JOBS
    - MODEL_CHECKS
    - MODEL_CHECK_TITLE
    - MODEL_CHECK_OUTPUT_DIR
    - JITTER_GRAD_REFERENCE
    - JITTER_REL_DIFF_THRESHOLD
    - JITTER_REPORT_DPI
    - MODEL_CHECK_GRAD_REFERENCE
    - MODEL_CHECK_REPORT_DPI
    - FLR4MFCL_GITHUB_REF
    - MFCLKIT_GITHUB_REF
    - MFCLSHINY_GITHUB_REF
    - KFLOW_RUNTIME_PACKAGES
    - KFLOW_REPO_RUNTIME_PACKAGES
    - KFLOW_REPO_RUNTIME_UPDATE
    - KFLOW_RUNTIME_UPDATE
    - TUNA_FLOW_RUNTIME_UPDATE
    - KFLOW_RUNTIME_UPDATE_INTERVAL_HOURS
